<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKAWARI 門頭屏模擬器 v0.3</title>
<style>
  *{box-sizing:border-box}
  body{background:#0d0b12;color:#d8d3e0;font-family:"Microsoft JhengHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:24px 14px;margin:0;
       min-height:100dvh;-webkit-tap-highlight-color:transparent}
  h1{font-size:15px;letter-spacing:2px;color:#a79fb3;font-weight:600;margin:0 0 4px;text-align:center}
  h1 b{color:#f7b32b}
  #meta{font-size:11px;color:#6e6a72;margin-bottom:14px;font-family:"Courier New",monospace;
        text-align:center;line-height:1.6;padding:0 4px}
  #frame{background:#16131c;padding:12px;border-radius:10px;border:1px solid #2a2535;
         box-shadow:0 12px 40px rgba(0,0,0,.6);width:100%;max-width:1200px}
  canvas{display:block;image-rendering:pixelated;width:100%;height:auto}
  #ui{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;
      width:100%;max-width:480px}
  button,select{background:#1f1a2a;color:#fff;border:1px solid #3a3348;border-radius:8px;
         padding:14px 16px;font-size:16px;font-family:inherit;cursor:pointer;
         touch-action:manipulation;flex:1 1 100%}
  button:active{border-color:#f7b32b;color:#f7b32b;background:#2a2438}
  @media(hover:hover){button:hover{border-color:#f7b32b;color:#f7b32b}}
  select{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
  @media(min-width:640px){
    button,select{flex:0 1 auto;padding:9px 18px;font-size:14px}
  }
  #log{margin-top:12px;font-size:11px;color:#6e6a72;font-family:"Courier New",monospace;
       min-height:16px;text-align:center;padding:0 4px}
</style>
</head>
<body>
<h1><b>OKAWARI QUEST</b>｜門頭屏模擬器 v0.3</h1>
<div id="meta"></div>
<div id="frame"><canvas id="led"></canvas></div>
<div id="ui">
  <button onclick="okawari()">＋ 續碗 OKAWARI（點幾碗按幾次）</button>
  <button onclick="triggerPatrol()">▶ 模擬整點巡邏</button>
  <select id="pitch" onchange="updateMeta()">
    <option value="2.5">P2.5（近看細緻）</option>
    <option value="3" selected>P3（3m 觀看）</option>
    <option value="4">P4（4m 觀看）</option>
    <option value="5">P5（美食街走道距離）</option>
  </select>
</div>
<div id="log">idle：紅→黃 像素漸變跑動中；續碗請按「＋」，點幾碗按幾次</div>

<script>
/* ================= 基本參數 ================= */
const COLS=128, ROWS=32;          // 規格鎖定：純長條單一連續屏
const CELL=7, GAP=2;
const cv=document.getElementById('led'), ctx=cv.getContext('2d');

/* ===== 可調參數 ===== */
const CONFIG={
  patrolMinSec: 18,  // 待機巡邏最短間隔（秒）
  patrolMaxSec: 40   // 待機巡邏最長間隔（秒）
};

/* 品牌色 */
const RED=[226,58,46], ORG=[240,120,24], YEL=[247,179,43];
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;

/* ================= 小勇者 sprite（12×12，兩幀走路） ================= */
const SPR_A=[
"....KKKK....","..KKWWWWKK..",".KWWWWWWWWK.",".KWWWWWWWWK.","KRRRRRRRRRRK",
".KWWKWWKWWK.",".KWWWWWWWWK.",".KWWWKKWWWK.","..KKWWWWKK..","...KOOOOK...",
"..KOOOOOOK..","...KK..KK..."];
const SPR_B=SPR_A.slice(0,11).concat(["..KK....KK.."]);
const SPC={K:[26,23,33],W:[255,253,246],R:RED,O:ORG};
const mirror=spr=>spr.map(r=>[...r].reverse().join(''));
const SPR_A_L=mirror(SPR_A), SPR_B_L=mirror(SPR_B);

/* ================= 劍（相對勇者 12×12 原點的 cell 座標） ================= */
const STEEL=[214,218,228];
/* 平舉：護手+水平劍身往前伸 */
const SWORD_READY=[[11,6,'G'],[12,6,'S'],[13,6,'S'],[14,6,'S'],[15,6,'S'],[16,6,'S']];
/* 斜劈：往前下砍 */
const SWORD_SLASH=[[11,7,'G'],[12,8,'S'],[13,9,'S'],[14,10,'S'],[15,11,'S']];
const SWC={S:STEEL,G:YEL};

/* ================= 石頭 sprite（8×6） ================= */
const STONE=[
"..SSSS..",
".SSSSDS.",
"SSWSSSDS",
"SSSSDSSS",
".SDSSSS.",
"..SSSS.."];
const STC={S:[148,150,160],D:[92,94,104],W:[205,208,218]};

/* ================= 像素文字（離屏 canvas 轉點陣，支援日文） ================= */
function textGrid(str,px){
  const oc=document.createElement('canvas'); const o=oc.getContext('2d');
  const font=`bold ${px}px "MS Gothic","Courier New",monospace`;
  o.font=font;
  const w=Math.ceil(o.measureText(str).width), h=px+3;
  oc.width=w; oc.height=h;
  o.font=font;
  o.fillStyle='#fff'; o.textBaseline='top'; o.fillText(str,0,0);
  const d=o.getImageData(0,0,w,h).data, g=[];
  for(let y=0;y<h;y++){const row=[];for(let x=0;x<w;x++)row.push(d[(y*w+x)*4+3]>110?1:0);g.push(row);}
  return g;
}
function fitTextGrid(str,px){
  let g=textGrid(str,px);
  while(g[0].length>COLS-4 && px>6){ px--; g=textGrid(str,px); }
  return g;
}
const TXT_EGG=fitTextGrid('おかわり おめでとう!',10);

/* ================= 狀態 ================= */
let off=0, frame=0;
let runners=[];            // 續碗勇者 {x,t,stoneX,state:'run'|'strike'|'burst',aT,debris}
let patrol=null;
let patrolNext=0;
let lastHour=new Date().getHours();

function schedulePatrol(){
  const sec=CONFIG.patrolMinSec+Math.random()*(CONFIG.patrolMaxSec-CONFIG.patrolMinSec);
  patrolNext=frame+Math.round(sec*60);
}
function updateMeta(){
  const p=parseFloat(document.getElementById('pitch').value);
  document.getElementById('meta').textContent=
    `${COLS}×${ROWS} px ｜ P${p} 點距 → 實體約 ${(COLS*p/10).toFixed(0)}×${(ROWS*p/10).toFixed(0)} cm ｜ 建議觀看距離 ≥ ${p} m`;
}
function init(){
  cv.width=COLS*(CELL+GAP)-GAP; cv.height=ROWS*(CELL+GAP)-GAP;
  updateMeta(); schedulePatrol();
}
function log(m){ document.getElementById('log').textContent=m; }

/* ================= 事件 ================= */
function okawari(){
  /* 每一次續碗都有一顆石頭等著被破 */
  let startX=-16;
  if(runners.length){
    const last=runners[runners.length-1];
    startX=Math.min(-16,last.x-22);
  }
  const stoneX=Math.round(COLS*(0.38+Math.random()*0.3));
  runners.push({x:startX,t:0,stoneX,state:'run',aT:0,debris:null});
  log(`OKAWARI +1 ── 勇者出發！（隊伍 ${runners.length} 隻）`);
}
function triggerPatrol(){
  if(!patrol && runners.length===0){
    spawnPatrol();
    log('EVENT：整點報時——小勇者巡邏中');
  }
}
function spawnPatrol(){
  const dir=Math.random()<0.5?1:-1;
  patrol={x:dir>0?-14:COLS+2, dir, t:0};
}

/* ================= 畫一顆 LED ================= */
function dot(x,y,c){
  ctx.fillStyle=rgb(c);
  const px=x*(CELL+GAP), py=y*(CELL+GAP);
  ctx.beginPath(); ctx.arc(px+CELL/2,py+CELL/2,CELL/2,0,7); ctx.fill();
}

/* ================= 漸變底色 ================= */
function gradientAt(x,y,dim){
  const PERIOD=COLS*1.6;
  let pos=((x+off)%PERIOD)/PERIOD;
  let t=pos<0.5?pos*2:(1-pos)*2;
  t+=(((x*7+y*13)%17)/17-0.5)*0.22;
  t=Math.max(0,Math.min(1,t));
  let c=t<0.5?lerp(RED,ORG,t*2):lerp(ORG,YEL,(t-0.5)*2);
  if(dim) c=c.map(v=>v*0.22);
  return c;
}

/* ================= 繪製工具 ================= */
function drawSprite(spr,ox,oy,scale,pal){
  const P=pal||SPC;
  spr.forEach((row,sy)=>{ [...row].forEach((ch,sx)=>{
    if(ch==='.')return;
    for(let dy=0;dy<scale;dy++)for(let dx=0;dx<scale;dx++){
      const x=ox+sx*scale+dx, y=oy+sy*scale+dy;
      if(x>=0&&x<COLS&&y>=0&&y<ROWS) dot(x,y,P[ch]);
    }});});
}
function drawCells(cells,ox,oy,scale,dir){
  cells.forEach(([cx,cy,ch])=>{
    const sx=dir<0?(11-cx):cx;
    for(let dy=0;dy<scale;dy++)for(let dx=0;dx<scale;dx++){
      const x=ox+sx*scale+dx, y=oy+cy*scale+dy;
      if(x>=0&&x<COLS&&y>=0&&y<ROWS) dot(x,y,SWC[ch]);
    }});
}
function drawText(g,ox,oy,color){
  g.forEach((row,y)=>row.forEach((v,x)=>{
    const X=ox+x,Y=oy+y;
    if(v&&X>=0&&X<COLS&&Y>=0&&Y<ROWS) dot(X,Y,color);
  }));
}
function drawBurst(cx,cy,r,color){
  const n=Math.max(8,r*3);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const x=Math.round(cx+Math.cos(a)*r), y=Math.round(cy+Math.sin(a)*r*0.6);
    if(x>=0&&x<COLS&&y>=0&&y<ROWS) dot(x,y,color);
  }
}

/* ================= 主迴圈 ================= */
const SCALE=2, SH=12*SCALE;
const STONE_W=8*SCALE, STONE_H=6*SCALE;
function tick(){
  frame++;
  ctx.fillStyle='#0d0b12'; ctx.fillRect(0,0,cv.width,cv.height);

  const busy=runners.length>0;
  off+=busy?0.25:0.6;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) dot(x,y,gradientAt(x,y,busy));

  /* ---- 待機巡邏（帶劍慢走、不壓暗） ---- */
  if(!busy){
    if(patrol){
      patrol.x+=0.45*patrol.dir; patrol.t++;
      const walk=patrol.t%20<10;
      const spr=patrol.dir>0?(walk?SPR_A:SPR_B):(walk?SPR_A_L:SPR_B_L);
      drawSprite(spr,Math.round(patrol.x),ROWS-SH,SCALE);
      drawCells(SWORD_READY,Math.round(patrol.x),ROWS-SH,SCALE,patrol.dir);
      if(patrol.x>COLS+4||patrol.x<-14-6){ patrol=null; schedulePatrol();
        log('idle：紅→黃 像素漸變跑動中'); }
    }else if(frame>=patrolNext){
      spawnPatrol(); log('小勇者巡邏中…');
    }
  }else{ patrol=null; }

  /* ---- 續碗勇者：跑 → 舉劍破石 → 碎石＋恭喜 → 繼續跑 ---- */
  for(const r of runners){
    const hx=Math.round(r.x), hy=ROWS-SH;
    if(r.state==='run'){
      r.x+=0.9; r.t++;
      /* 石頭在前方（未破） */
      if(r.stoneX>=0) drawSprite(STONE,r.stoneX,ROWS-STONE_H,SCALE,STC);
      drawSprite(r.t%16<8?SPR_A:SPR_B,hx,hy,SCALE);
      drawCells(SWORD_READY,hx,hy,SCALE,1);
      /* 劍尖碰到石頭 → 開始劈 */
      if(r.stoneX>=0 && r.x+17*SCALE>=r.stoneX){ r.state='strike'; r.aT=0; }
    }
    else if(r.state==='strike'){
      r.aT++;
      drawSprite(STONE,r.stoneX,ROWS-STONE_H,SCALE,STC);
      drawSprite(SPR_A,hx,hy,SCALE);
      /* 舉劍/劈下 交替兩次 */
      const slash=(r.aT%14)>=7;
      drawCells(slash?SWORD_SLASH:SWORD_READY,hx,hy,SCALE,1);
      /* 劈下時石頭上冒火花 */
      if(slash) drawBurst(r.stoneX+8,ROWS-STONE_H+2,3,[255,253,246]);
      if(r.aT>=28){
        r.state='burst'; r.aT=0;
        /* 生成碎石粒子 */
        r.debris=[];
        for(let i=0;i<12;i++){
          r.debris.push({x:r.stoneX+8,y:ROWS-6,
            vx:-1.0+Math.random()*2.4, vy:-2.2+Math.random()*1.2});
        }
        log('★ 破石！おかわり おめでとう！');
      }
    }
    else{ /* burst：碎石飛散＋星芒＋字幕 */
      r.aT++;
      const bx=r.stoneX+8, by=ROWS-8;
      drawSprite(SPR_A,hx,hy,SCALE);
      drawCells(SWORD_SLASH,hx,hy,SCALE,1);
      /* 星芒兩圈 */
      const ph=r.aT%18;
      drawBurst(bx,by,2+ph*0.9,YEL);
      if(ph>4) drawBurst(bx,by,ph*0.7,[255,253,246]);
      /* 碎石粒子（拋物線） */
      for(const d of r.debris){
        d.x+=d.vx; d.y+=d.vy; d.vy+=0.09;
        const X=Math.round(d.x),Y=Math.round(d.y);
        if(X>=0&&X<COLS&&Y>=0&&Y<ROWS) dot(X,Y,STC.S);
      }
      /* 日文字幕閃爍 */
      if(r.aT%14<10)
        drawText(TXT_EGG,Math.round((COLS-TXT_EGG[0].length)/2),2,YEL);
      if(r.aT>84){ r.state='run'; r.stoneX=-999; }  /* 石頭已破，繼續跑 */
    }
  }
  runners=runners.filter(r=>r.x<=COLS+4);

  /* 整點自動觸發巡邏 */
  const h=new Date().getHours();
  if(h!==lastHour){ lastHour=h; triggerPatrol(); }

  requestAnimationFrame(tick);
}
init(); tick();
</script>
</body>
</html>
